<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SuratKu{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background:#f1f5f9; min-height:100vh; }
    .navbar { background:linear-gradient(135deg,#1e1b4b,#4338ca); }
    .card { border:0; border-radius:16px; box-shadow:0 6px 20px rgba(30,27,75,.08); }
    .btn-primary { --bs-btn-bg:#4338ca; --bs-btn-border-color:#4338ca; --bs-btn-hover-bg:#3730a3; --bs-btn-hover-border-color:#3730a3; }
    .tpl-card { transition:transform .2s, box-shadow .2s; text-decoration:none; color:inherit; }
    .tpl-card:hover { transform:translateY(-5px); box-shadow:0 14px 30px rgba(67,56,202,.22); color:inherit; }
    .tpl-icon { width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center;
                font-size:1.7rem; background:#e0e7ff; color:#4338ca; }
    @media print { .no-print { display:none !important; } body { background:#fff; } }
  </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-dark mb-4 no-print">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}"><i class="bi bi-file-earmark-text-fill me-2"></i>SuratKu</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link {{ 'active fw-semibold' if request.endpoint == 'index' }}" href="{{ url_for('index') }}"><i class="bi bi-grid-fill"></i> Beranda</a>
      <a class="nav-link {{ 'active fw-semibold' if request.endpoint == 'arsip' }}" href="{{ url_for('arsip') }}"><i class="bi bi-archive-fill"></i> Arsip</a>
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% for kategori, pesan in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ kategori }} alert-dismissible fade show no-print">{{ pesan }}<button class="btn-close" data-bs-dismiss="alert"></button></div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
