{% extends "base.html" %}
{% block title %}Arsip Surat - SuratKu{% endblock %}
{% block content %}
<div class="card"><div class="card-body">
  <h1 class="h4 fw-bold mb-3"><i class="bi bi-archive-fill text-primary"></i> Arsip Surat</h1>
  <form method="get" class="row g-2 mb-3">
    <div class="col-md-7"><input class="form-control" name="q" value="{{ q }}" placeholder="Cari nomor, jenis, nama, atau isi surat..."></div>
    <div class="col-md-3">
      <select class="form-select" name="jenis" onchange="this.form.submit()">
        <option value="">Semua jenis</option>
        {% for key, t in surat.items() %}<option value="{{ key }}" {{ 'selected' if key == jenis }}>{{ t.nama }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-2 d-grid"><button class="btn btn-primary"><i class="bi bi-search"></i> Cari</button></div>
  </form>
  <div class="table-responsive"><table class="table align-middle">
    <thead><tr><th>Nomor</th><th>Jenis</th><th>Tanggal</th><th class="text-end">Aksi</th></tr></thead>
    <tbody>
    {% for r in rows %}
    <tr>
      <td class="fw-medium">{{ r.nomor }}</td><td>{{ r.judul }}</td><td>{{ r.dibuat }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('lihat', sid=r.id) }}"><i class="bi bi-eye"></i></a>
        <form method="post" action="{{ url_for('hapus', sid=r.id) }}" class="d-inline" onsubmit="return confirm('Hapus surat {{ r.nomor }}?')">
          <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted py-4">Tidak ada surat yang cocok.</td></tr>
    {% endfor %}
    </tbody></table></div>
</div></div>
{% endblock %}
